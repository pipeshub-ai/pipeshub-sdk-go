name: Release to GitHub

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Extract version from .speakeasy/gen.yaml
        id: version
        run: |
          VERSION=$(python3 -c "import yaml; data=yaml.safe_load(open('.speakeasy/gen.yaml')); print(data['go']['version'])")
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git tag "v${{ steps.version.outputs.VERSION }}"
          git push origin "v${{ steps.version.outputs.VERSION }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true

      - name: Set up ORAS
        uses: oras-project/setup-oras@v1

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push to GitHub Packages
        run: |
          ZIP="pipeshub-sdk-go-v${{ steps.version.outputs.VERSION }}.zip"
          git archive --format=zip --prefix="pipeshub-sdk-go-v${{ steps.version.outputs.VERSION }}/" -o "$ZIP" HEAD
          oras push "ghcr.io/pipeshub-ai/pipeshub-sdk-go:${{ steps.version.outputs.VERSION }}" \
            --artifact-type application/vnd.pipeshub.sdk.go \
            --annotation "org.opencontainers.image.source=https://github.com/pipeshub-ai/pipeshub-ai" \
            --annotation "org.opencontainers.image.description=PipesHub Go SDK. Install with: go get github.com/pipeshub-ai/pipeshub-sdk-go@v${{ steps.version.outputs.VERSION }}" \
            --annotation "org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}" \
            --annotation "org.opencontainers.image.licenses=Apache-2.0" \
            "$ZIP"
          oras tag "ghcr.io/pipeshub-ai/pipeshub-sdk-go:${{ steps.version.outputs.VERSION }}" latest
